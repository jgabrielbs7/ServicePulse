<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body class="min-h-screen bg-gray-50 font-sans text-gray-900 antialiased dark:bg-gray-900 dark:text-gray-100">

  <div class="absolute right-4 top-4">
    <th:block th:replace="~{fragments/layout :: themeToggle}"></th:block>
  </div>

  <main class="flex min-h-screen items-center justify-center px-4">
    <div class="w-full max-w-sm">
      <div class="flex flex-col items-center text-center">
        <h1 class="text-xl font-semibold">ServicePulse</h1>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Entre para acompanhar seus chamados.</p>

        <div class="mt-6 flex flex-col items-center justify-center">
          <img th:src="@{/images/logo.png}" alt="ServicePulse" class="h-24 w-auto object-contain mx-auto block">
          <h3 class="mt-3 text-lg font-bold text-blue-600 dark:text-blue-400">ServicePulse</h3>
        </div>
      </div>

      <form th:action="@{/login}" method="post" class="card mt-6 space-y-4 p-6">
        <div th:if="${param.error}" role="alert"
             class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700 dark:bg-red-500/10 dark:text-red-300">
          E-mail ou senha incorretos.
        </div>
        <div th:if="${param.logout}" role="status"
             class="rounded-md bg-emerald-50 px-3 py-2 text-sm text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-300">
          Você saiu do sistema.
        </div>

        <div>
          <label for="username" class="field-label">E-mail</label>
          <input id="username" name="username" type="email" autocomplete="username" required autofocus class="field" placeholder="voce@empresa.com">
        </div>
        <div>
          <label for="password" class="field-label">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required class="field">
        </div>
        <button type="submit" class="btn-primary w-full">Entrar</button>
      </form>
    </div>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
