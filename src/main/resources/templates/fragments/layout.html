<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- HEAD: tema aplicado antes da renderização para evitar "flash" -->
<head th:fragment="head(title)">
  <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
  <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
  <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
  <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · ServicePulse'">ServicePulse</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'] } } }
    };
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .card { @apply rounded-lg border border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800; }
      .field { @apply block w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:border-gray-600 focus:outline-none focus:ring-1 focus:ring-gray-600 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100 dark:placeholder-gray-500 dark:focus:border-gray-400 dark:focus:ring-gray-400; }
      .field-label { @apply mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300; }
      .field-error { @apply mt-1 text-sm text-red-600 dark:text-red-400; }
      .btn-primary { @apply inline-flex items-center justify-center rounded-md bg-gray-600 px-4 py-2 text-sm font-medium text-white hover:bg-gray-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-600 focus-visible:ring-offset-2 dark:ring-offset-gray-900; }
      .btn-secondary { @apply inline-flex items-center justify-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-gray-700; }
      .badge { @apply inline-flex items-center whitespace-nowrap rounded-md px-2 py-0.5 text-xs font-medium; }
    }
  </style>
</head>

<body>

<!-- MENU LATERAL -->
<aside th:fragment="topbar(ativo)" class="fixed inset-y-0 left-0 z-40 flex w-64 -trangray-x-full flex-col border-r border-gray-300 bg-gray-200 text-gray-800 transition-transform dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100 lg:trangray-x-0" id="sidebar">
  <div class="flex h-16 items-center gap-3 border-b border-gray-300 px-5 dark:border-gray-700">
    <img th:src="@{/images/logo.png}" alt="ServicePulse" class="h-8 w-8 object-contain">
    <span class="text-lg font-semibold">ServicePulse</span>
    <button type="button" id="closeSidebar" class="ml-auto rounded p-1 text-xl lg:hidden" aria-label="Fechar menu">×</button>
  </div>
  <nav class="flex-1 space-y-1 p-3 text-sm" aria-label="Menu principal">
    <p class="px-3 pb-2 pt-3 text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Principal</p>
    <a sec:authorize="hasAnyRole('ADMIN','TECNICO')" th:href="@{/admin/dashboard}" class="block rounded-lg px-3 py-2.5 font-medium" th:classappend="${ativo == 'dashboard'} ? 'bg-gray-400/60 text-gray-900 dark:bg-gray-700 dark:text-white' : 'hover:bg-gray-300/70 dark:hover:bg-gray-700'">Chamados</a>
    <a sec:authorize="hasAnyRole('ADMIN','TECNICO')" th:href="@{/chamados/novo}" class="block rounded-lg px-3 py-2.5 font-medium" th:classappend="${ativo == 'novo'} ? 'bg-gray-400/60 text-gray-900 dark:bg-gray-700 dark:text-white' : 'hover:bg-gray-300/70 dark:hover:bg-gray-700'">＋ Novo chamado</a>
    <a sec:authorize="hasAnyRole('ADMIN','TECNICO')" th:href="@{/clientes}" class="block rounded-lg px-3 py-2.5 font-medium" th:classappend="${ativo == 'clientes'} ? 'bg-gray-400/60 text-gray-900 dark:bg-gray-700 dark:text-white' : 'hover:bg-gray-300/70 dark:hover:bg-gray-700'">Clientes</a>
    <p sec:authorize="hasRole('ADMIN')" class="px-3 pb-2 pt-6 text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Administração</p>
    <a sec:authorize="hasAnyRole('ADMIN','TECNICO')" th:href="@{/admin/analytics}" class="block rounded-lg px-3 py-2.5 font-medium" th:classappend="${ativo == 'analytics'} ? 'bg-gray-400/60 text-gray-900 dark:bg-gray-700 dark:text-white' : 'hover:bg-gray-300/70 dark:hover:bg-gray-700'">Analytics</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/usuarios}" class="block rounded-lg px-3 py-2.5 font-medium" th:classappend="${ativo == 'usuarios'} ? 'bg-gray-400/60 text-gray-900 dark:bg-gray-700 dark:text-white' : 'hover:bg-gray-300/70 dark:hover:bg-gray-700'">Usuários</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/motivos}" class="block rounded-lg px-3 py-2.5 font-medium" th:classappend="${ativo == 'motivos'} ? 'bg-gray-400/60 text-gray-900 dark:bg-gray-700 dark:text-white' : 'hover:bg-gray-300/70 dark:hover:bg-gray-700'">Motivos</a>
  </nav>
  <div class="border-t border-gray-300 p-4 dark:border-gray-700">
    <p class="mb-3 truncate text-sm text-gray-600 dark:text-gray-300" sec:authentication="name">usuario</p>
    <div class="flex items-center gap-2">
      <th:block th:replace="~{fragments/layout :: themeToggle}"></th:block>
      <form th:action="@{/logout}" method="post" class="flex-1"><button type="submit" class="btn-secondary w-full !px-3 !py-1.5">Sair</button></form>
    </div>
  </div>
</aside>
<div th:fragment="mobileMenu" class="fixed inset-x-0 top-0 z-30 flex h-14 items-center gap-3 border-b border-gray-300 bg-gray-200 px-4 dark:border-gray-700 dark:bg-gray-800 lg:hidden">
  <button type="button" id="openSidebar" class="rounded-md border border-gray-400 px-3 py-1.5" aria-label="Abrir menu">☰</button>
  <span class="font-semibold">ServicePulse</span>
</div>
<div th:fragment="sidebarScripts">
  <div id="sidebarOverlay" class="fixed inset-0 z-30 hidden bg-black/40 lg:hidden"></div>
  <script>
    (function () {
      const side = document.getElementById('sidebar'), overlay = document.getElementById('sidebarOverlay');
      const open = () => { side.classList.remove('-trangray-x-full'); overlay.classList.remove('hidden'); };
      const close = () => { side.classList.add('-trangray-x-full'); overlay.classList.add('hidden'); };
      document.getElementById('openSidebar')?.addEventListener('click', open);
      document.getElementById('closeSidebar')?.addEventListener('click', close);
      overlay?.addEventListener('click', close);
    })();
  </script>
</div>

<!-- ALTERNADOR DE TEMA -->
<button th:fragment="themeToggle" type="button" data-theme-toggle aria-label="Alternar tema claro/escuro"
        class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-gray-300 bg-white text-gray-600 hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700">
  <svg class="h-4 w-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="hidden h-4 w-4 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<!-- SCRIPT DO TEMA (salva no LocalStorage) -->
<th:block th:fragment="scripts">
  <script>
    (function () {
      const side = document.getElementById('sidebar'), overlay = document.getElementById('sidebarOverlay');
      const open = () => { side?.classList.remove('-trangray-x-full'); overlay?.classList.remove('hidden'); };
      const close = () => { side?.classList.add('-trangray-x-full'); overlay?.classList.add('hidden'); };
      document.getElementById('openSidebar')?.addEventListener('click', open);
      document.getElementById('closeSidebar')?.addEventListener('click', close);
      overlay?.addEventListener('click', close);
    })();
    document.addEventListener('click', function (e) {
      if (!e.target.closest('[data-theme-toggle]')) return;
      var dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (err) {}
      window.dispatchEvent(new Event('themechange'));
    });
  </script>
</th:block>

<!-- BADGES -->
<span th:fragment="statusBadge(s)" class="badge"
      th:classappend="${s.name() == 'ABERTO'} ? 'bg-gray-100 text-gray-700 dark:bg-gray-500/10 dark:text-gray-300'
        : (${s.name() == 'EM_ANDAMENTO'} ? 'bg-amber-50 text-amber-700 dark:bg-amber-500/10 dark:text-amber-300'
        : (${s.name() == 'AGUARDANDO_CLIENTE'} ? 'bg-violet-50 text-violet-700 dark:bg-violet-500/10 dark:text-violet-300'
        : 'bg-emerald-50 text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-300'))"
      th:text="${s.label}">Aberto</span>

<span th:fragment="prioridadeBadge(p)" class="badge"
      th:classappend="${p.name() == 'CRITICA'} ? 'bg-red-50 text-red-700 dark:bg-red-500/10 dark:text-red-300'
        : (${p.name() == 'ALTA'} ? 'bg-orange-50 text-orange-700 dark:bg-orange-500/10 dark:text-orange-300'
        : (${p.name() == 'MEDIA'} ? 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200'
        : 'bg-gray-50 text-gray-500 dark:bg-gray-800 dark:text-gray-400'))"
      th:text="${p.label}">Média</span>

</body>
</html>
