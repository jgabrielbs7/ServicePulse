<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body class="min-h-screen bg-gray-100 font-sans text-gray-900 antialiased dark:bg-gray-900 dark:text-gray-100">
  <header th:replace="~{fragments/layout :: topbar('clientes')}"></header>

  <div th:replace="~{fragments/layout :: mobileMenu}"></div>
  <div id="sidebarOverlay" class="fixed inset-0 z-30 hidden bg-black/40 lg:hidden"></div>
  <main class="lg:ml-64 pt-14 lg:pt-0 mx-auto max-w-5xl px-4 py-8 sm:px-6">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <h1 class="text-xl font-semibold">Clientes</h1>
      <a th:href="@{/clientes/novo}" class="btn-primary">Novo cliente</a>
    </div>

    <div th:if="${sucesso}" role="status" th:text="${sucesso}"
         class="mt-4 rounded-md bg-emerald-50 px-3 py-2 text-sm text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-300"></div>

    <section class="card mt-6 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="border-b border-gray-200 bg-gray-50 text-left text-gray-600 dark:border-gray-700 dark:bg-gray-900/40 dark:text-gray-300">
            <tr>
              <th class="px-4 py-3 font-medium">Razão social / nome</th>
              <th class="px-4 py-3 font-medium">CPF / CNPJ</th>
              <th class="px-4 py-3 font-medium">E-mail</th>
              <th class="px-4 py-3 font-medium">Telefone</th>
              <th class="px-4 py-3"><span class="sr-only">Ações</span></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
            <tr th:each="c : ${clientes}" class="hover:bg-gray-50 dark:hover:bg-gray-700/40">
              <td class="px-4 py-3 font-medium" th:text="${c.razaoSocial}">Cliente</td>
              <td class="whitespace-nowrap px-4 py-3 text-gray-600 dark:text-gray-300" th:text="${c.cpfCnpj}">00.000.000/0000-00</td>
              <td class="px-4 py-3 text-gray-600 dark:text-gray-300" th:text="${c.emailContato != null} ? ${c.emailContato} : '—'">email</td>
              <td class="whitespace-nowrap px-4 py-3 text-gray-600 dark:text-gray-300" th:text="${c.telefone != null} ? ${c.telefone} : '—'">telefone</td>
              <td class="whitespace-nowrap px-4 py-3 text-right">
                <a th:href="@{/clientes/{id}/editar(id=${c.id})}"
                   class="font-medium text-gray-600 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">Editar</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <p th:if="${#lists.isEmpty(clientes)}" class="px-4 py-10 text-center text-sm text-gray-500 dark:text-gray-400">
        Nenhum cliente cadastrado. Use “Novo cliente” para começar.
      </p>
    </section>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
