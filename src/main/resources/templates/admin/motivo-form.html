<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Motivo')}"></head>
<body class="min-h-screen bg-gray-50 font-sans text-gray-900 antialiased dark:bg-gray-900 dark:text-gray-100">
  <header th:replace="~{fragments/layout :: topbar('motivos')}"></header>

  <div th:replace="~{fragments/layout :: mobileMenu}"></div>
  <div id="sidebarOverlay" class="fixed inset-0 z-30 hidden bg-black/40 lg:hidden"></div>
  <main class="lg:ml-64 pt-14 lg:pt-0 mx-auto max-w-xl px-4 py-8 sm:px-6">
    <h1 class="text-xl font-semibold" th:text="${form.id == null} ? 'Novo motivo' : 'Editar motivo'">Motivo</h1>

    <form th:action="${form.id == null} ? @{/admin/motivos} : @{/admin/motivos/{id}(id=${form.id})}"
          th:object="${form}" method="post" class="card mt-6 space-y-5 p-6">
      <div>
        <label for="nome" class="field-label">Nome do motivo</label>
        <input id="nome" type="text" th:field="*{nome}" class="field" autofocus placeholder="Ex.: Problema no e-mail">
        <p th:if="${form.id != null}" class="mt-1 text-sm text-gray-500 dark:text-gray-400">
          Ao renomear, os chamados já abertos com este motivo passam a usar o novo nome.
        </p>
        <p class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>
      </div>

      <label class="flex items-start gap-3 text-sm">
        <input type="checkbox" th:field="*{ativo}" class="mt-0.5 h-4 w-4 rounded border-gray-300 text-gray-600 focus:ring-gray-600 dark:border-gray-600 dark:bg-gray-900">
        <span>
          <span class="font-medium">Motivo ativo</span>
          <span class="block text-gray-500 dark:text-gray-400">Motivos inativos não aparecem ao abrir um novo chamado.</span>
        </span>
      </label>

      <div class="flex justify-end gap-3">
        <a th:href="@{/admin/motivos}" class="btn-secondary">Cancelar</a>
        <button type="submit" class="btn-primary">Salvar</button>
      </div>
    </form>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
