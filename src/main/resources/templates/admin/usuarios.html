<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Usuários')}"></head>
<body class="min-h-screen bg-gray-100 font-sans text-gray-900 antialiased dark:bg-gray-900 dark:text-gray-100">
  <header th:replace="~{fragments/layout :: topbar('usuarios')}"></header>

  <div th:replace="~{fragments/layout :: mobileMenu}"></div>
  <div id="sidebarOverlay" class="fixed inset-0 z-30 hidden bg-black/40 lg:hidden"></div>
  <main class="lg:ml-64 pt-14 lg:pt-0 mx-auto max-w-5xl px-4 py-8 sm:px-6">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-xl font-semibold">Usuários</h1>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Cadastre técnicos e defina o que cada um pode acessar.</p>
      </div>
      <a th:href="@{/admin/usuarios/novo}" class="btn-primary">Novo usuário</a>
    </div>

    <div th:if="${sucesso}" role="status" th:text="${sucesso}"
         class="mt-4 rounded-md bg-emerald-50 px-3 py-2 text-sm text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-300"></div>
    <div th:if="${erro}" role="alert" th:text="${erro}"
         class="mt-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700 dark:bg-red-500/10 dark:text-red-300"></div>

    <section class="card mt-6 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="border-b border-gray-200 bg-gray-50 text-left text-gray-600 dark:border-gray-700 dark:bg-gray-900/40 dark:text-gray-300">
            <tr>
              <th class="px-4 py-3 font-medium">Nome</th>
              <th class="px-4 py-3 font-medium">E-mail</th>
              <th class="px-4 py-3 font-medium">Perfil</th>
              <th class="px-4 py-3 font-medium">Situação</th>
              <th class="px-4 py-3"><span class="sr-only">Ações</span></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
            <tr th:each="u : ${usuarios}" class="hover:bg-gray-50 dark:hover:bg-gray-700/40">
              <td class="px-4 py-3 font-medium" th:text="${u.nome}">Nome</td>
              <td class="px-4 py-3 text-gray-600 dark:text-gray-300" th:text="${u.email}">email</td>
              <td class="px-4 py-3">
                <span class="badge" th:text="${u.perfil.label}"
                      th:classappend="${u.perfil.name() == 'ADMIN'} ? 'bg-gray-100 text-gray-700 dark:bg-gray-500/10 dark:text-gray-300' : 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200'">Perfil</span>
              </td>
              <td class="px-4 py-3">
                <span class="badge" th:text="${u.ativo} ? 'Ativo' : 'Inativo'"
                      th:classappend="${u.ativo} ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-300' : 'bg-gray-100 text-gray-500 dark:bg-gray-700 dark:text-gray-400'">Ativo</span>
              </td>
              <td class="whitespace-nowrap px-4 py-3 text-right">
                <a th:href="@{/admin/usuarios/{id}/editar(id=${u.id})}"
                   class="font-medium text-gray-600 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">Editar</a>
                <form th:unless="${u.email == logado}" th:action="@{/admin/usuarios/{id}/ativo(id=${u.id})}" method="post" class="ml-4 inline">
                  <button type="submit" class="font-medium text-gray-600 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white"
                          th:text="${u.ativo} ? 'Desativar' : 'Ativar'">Desativar</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
