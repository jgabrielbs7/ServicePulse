<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Motivos')}"></head>
<body class="min-h-screen bg-gray-50 font-sans text-gray-900 antialiased dark:bg-gray-900 dark:text-gray-100">
  <header th:replace="~{fragments/layout :: topbar('motivos')}"></header>

  <div th:replace="~{fragments/layout :: mobileMenu}"></div>
  <div id="sidebarOverlay" class="fixed inset-0 z-30 hidden bg-black/40 lg:hidden"></div>
  <main class="lg:ml-64 pt-14 lg:pt-0 mx-auto max-w-3xl px-4 py-8 sm:px-6">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-xl font-semibold">Motivos de chamado</h1>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Opções exibidas ao abrir um chamado. Motivos desativados deixam de aparecer, mas o histórico é mantido.</p>
      </div>
      <a th:href="@{/admin/motivos/novo}" class="btn-primary">Novo motivo</a>
    </div>

    <div th:if="${sucesso}" role="status" th:text="${sucesso}"
         class="mt-4 rounded-md bg-emerald-50 px-3 py-2 text-sm text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-300"></div>

    <section class="card mt-6 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="border-b border-gray-200 bg-gray-50 text-left text-gray-600 dark:border-gray-700 dark:bg-gray-900/40 dark:text-gray-300">
            <tr>
              <th class="px-4 py-3 font-medium">Motivo</th>
              <th class="px-4 py-3 font-medium">Chamados</th>
              <th class="px-4 py-3 font-medium">Situação</th>
              <th class="px-4 py-3"><span class="sr-only">Ações</span></th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
            <tr th:each="m : ${motivos}" class="hover:bg-gray-50 dark:hover:bg-gray-700/40">
              <td class="px-4 py-3 font-medium" th:text="${m.nome}">Motivo</td>
              <td class="px-4 py-3 text-gray-600 dark:text-gray-300" th:text="${usos.get(m.nome) ?: 0}">0</td>
              <td class="px-4 py-3">
                <span class="badge" th:text="${m.ativo} ? 'Ativo' : 'Inativo'"
                      th:classappend="${m.ativo} ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-300' : 'bg-gray-100 text-gray-500 dark:bg-gray-700 dark:text-gray-400'">Ativo</span>
              </td>
              <td class="whitespace-nowrap px-4 py-3 text-right">
                <a th:href="@{/admin/motivos/{id}/editar(id=${m.id})}"
                   class="font-medium text-gray-600 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">Editar</a>
                <form th:action="@{/admin/motivos/{id}/ativo(id=${m.id})}" method="post" class="ml-4 inline">
                  <button type="submit" class="font-medium text-gray-600 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white"
                          th:text="${m.ativo} ? 'Desativar' : 'Ativar'">Desativar</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <p th:if="${#lists.isEmpty(motivos)}" class="px-4 py-10 text-center text-sm text-gray-500 dark:text-gray-400">
        Nenhum motivo cadastrado. Use “Novo motivo” para começar.
      </p>
    </section>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
