spring.application.name=helpdesk

# Porta: o Render define PORT automaticamente; localmente usa 8080
server.port=${PORT:8080}
# Necessário atrás de proxy HTTPS (Render): mantém links e redirecionamentos em https
server.forward-headers-strategy=framework

# PostgreSQL (sobrescreva por variáveis de ambiente)
spring.datasource.url=jdbc:postgresql://ep-ancient-darkness-b52uak6b-pooler.c-7.us-east-2.aws.neon.tech/neondb?user=neondb_owner&password=npg_TIwZG7H4lLcQ&sslmode=require&channelBinding=require&timezone=America/Sao_Paulo
spring.datasource.username=neondb_owner
spring.datasource.password=npg_TIwZG7H4lLcQ
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.web.locale=pt_BR

# Dados de EXEMPLO (admin123 etc.). Use true apenas em testes locais com banco vazio.
app.seed-demo-data=${SEED_DEMO_DATA:false}

# Primeiro administrador (usado só se o banco estiver sem usuários e seed-demo-data=false)
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
